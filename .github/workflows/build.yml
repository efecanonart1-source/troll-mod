name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build-android64:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compatible Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

  build-android32:
    name: Android32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compatible Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" --sdk_root=$ANDROID_HOME
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android32
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          configure-args: -DCMAKE_POLICY_VERSION_MINIMUM=3.5
